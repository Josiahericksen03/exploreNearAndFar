    p { margin: 0 0 1.25rem; opacity: .85; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));

    figure {
      margin: 0;

    }
    img {

      object-position: center 20%;

    }
    figcaption {
      padding: .55rem .65rem;
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
    }
    a { color: #78c6d0; }
  </style>
</head>
